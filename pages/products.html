<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="icon/image" href="../assets/images/bag-shopping-solid.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div class="mega-menu">
        <nav>
            <div class="main-logo">
                <a href="">
                    <i class="fa-solid fa-bag-shopping"></i>ShopEZ
                </a>
            </div>
            <div class="navbar-page-list">
                <ul class="page-list">
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../pages/products.html">Shop</a></li>
                    <li><a href="../pages/products.html?filter=wishlist">Wishlist</a></li>
                    <li><a href="../pages/cart.html">Cart</a></li>
                    <li><a href="../pages/orders.html">Orders</a></li>
                </ul>
            </div>
            <div class="icons">
                <a href="pages/products.html?filter=wishlist"><span id="wishlist-count"></span><i id="fav-icon" class="fa-regular fa-heart"></i></a>
                <a href="pages/cart.html"><span id="cart-count"></span><i class="fa-solid fa-cart-shopping"></i></a>
                <div class="avatar"><a href="pages/login.html"></a></div>
            </div>
        </nav>
    </div>
    <main class="container3 shop-layout">
        <aside class="filters-sidebar">
            <div class="filter-header">
                <h3>Filters</h3>
                 <button id="reset-filters-btn" class="reset-btn">Reset All</button>
            </div>
            <div class="filter-group">
                <h4>Category</h4>
                <select id="category-filter">
                    <option value="All">All categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Men's Wear">Men's Wear</option>
                    <option value="Women's Wear">Women's Wear</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Sunglasses">Sunglasses</option>
                    <option value="Jewelery">Jewelery</option>
                </select>
            </div>
            <div class="filter-group">
                <h4>Max Price: Rs. <span id="price-value">10000</span></h4>
                <input type="range" id="price-filter" min="0" max="10000" step="1" value="10000">
            </div>
            <div class="filter-group">
                <h4>Minimum Rating</h4>
                <select id="rating-filter">
                    <option value="0">All Rating</option>
                    <option value="4.5">4.5 & above</option>
                    <option value="4">4.0 & above</option>
                    <option value="3">3.0 & above</option>
                </select>
            </div>
        </aside>
        <section class="shop-main">
            <div class="shop-topbar">
                <h2 id="page-heading">All Products</h2>
                <div class="search-sort-box">
                    <input type="text" id="search-input" placeholder="Search Products...">
                    <select id="sort-select">
                        <option value="default">Sort by: Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                        <option value="popularity">Most Popular</option>
                    </select>
                </div>
            </div>
            <p id="result-count" class="result-text">Loading products...</p>
            <div class="products-grid" id="shop-products-grid"></div>
            <div class="pagination-box" id="pagination-controls"></div>
        </section>
    </main>

    <script type="module" src="../js/modules/product.js"></script>
</body>
</html>
